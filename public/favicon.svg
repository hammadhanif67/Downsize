<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16">
  <!--
    A redrawn mark, not the logo scaled down. Everything here is chosen so
    it lands on whole pixels at 16px (1 unit = 2/3 px, so all values are
    multiples of 1.5) — otherwise the edges antialias into mush:

      stroke 3 units  -> 2px band
      inner  9 units  -> crisp 6x6 square
      gap    1.5      -> 1px clear on the bottom and left

    The inner square is smaller than the logo's (9/24 vs 11/24) and pushed
    harder into the corner: at this size a 45% square with even gaps just
    reads as "centred", which loses the whole idea of the mark.

    The stroke flips to white under a dark colour scheme — a black outline
    on transparency is invisible against a dark browser tab strip.
  -->
  <style>
    .frame { stroke: #000000; }
    @media (prefers-color-scheme: dark) {
      .frame { stroke: #ffffff; }
    }
  </style>
  <rect class="frame" x="1.5" y="1.5" width="21" height="21" fill="none" stroke-width="3" />
  <rect x="4.5" y="10.5" width="9" height="9" fill="#1b4fd8" />
</svg>
